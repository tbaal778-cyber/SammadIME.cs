name: Build Sammad Keyboard APK
on:
  push:
      branches: [ "main" ]
        workflow_dispatch:
        jobs:
          build:
              runs-on: windows-latest
                  steps:
                      - name: Checkout Code
                            uses: actions/checkout@v4
                                - name: Setup NuGet
                                      uses: NuGet/setup-nuget@v2
                                          - name: Setup MSBuild
                                                uses: microsoft/setup-msbuild@v2
                                                    - name: Build Android APK
                                                          run: |
                                                                  msbuild /p:Configuration=Release /t:SignAndroidPackage /p:AndroidBuildApplicationPackage=true
                                                                      - name: Upload APK Artifact
                                                                            uses: actions/upload-artifact@v4
                                                                                  with:
                                                                                          name: SammadKeyboard-APK
                                                                                                  path: |
                                                                                                            **/*.apk
