name: Build Sammad Keyboard APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1

    - name: NuGet Restore
      run: nuget restore

    - name: Build Android APK
      run: msbuild /p:Configuration=Release /t:SignAndroidPackage
      
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: SammadKeyboard-APK
        path: |
          **/*.apk
          
